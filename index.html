<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula Virtual - Inicio</title>
    <link rel="stylesheet" href="css/styles.css?v=4">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="login-page">
    <div class="background-animation">
        <div class="floating-shapes">
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
        </div>
    </div>

    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <div class="logo-3d">
                    <div class="cube">
                        <div class="face front">🎓</div>
                        <div class="face back">📚</div>
                        <div class="face right">💡</div>
                        <div class="face left">🚀</div>
                        <div class="face top">⭐</div>
                        <div class="face bottom">🎯</div>
                    </div>
                </div>
                <h1>Aula Virtual</h1>
                <p class="subtitle">Plataforma Educativa del Futuro</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <div class="input-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </div>
                    <input type="text" id="username" placeholder="Usuario" required autocomplete="username">
                    <div class="input-highlight"></div>
                </div>

                <div class="input-group">
                    <div class="input-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </div>
                    <input type="password" id="password" placeholder="Contraseña" required autocomplete="current-password">
                    <button type="button" class="toggle-password" onclick="togglePassword('password')">
                        <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                    <div class="input-highlight"></div>
                </div>

                <button type="submit" class="btn-login">
                    <span class="btn-text">Iniciar Sesión</span>
                    <span class="btn-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M5 12h14M12 5l7 7-7 7"></path>
                        </svg>
                    </span>
                    <div class="btn-bg"></div>
                </button>
            </form>

            <div id="loginMessage" class="message"></div>

            <div class="login-footer">
                <p>¿Problemas para acceder? Contacta al administrador</p>
            </div>
        </div>

        <div class="info-cards">
            <div class="info-card">
                <div class="card-icon">📖</div>
                <h3>Cursos Ilimitados</h3>
                <p>Accede a contenido educativo de alta calidad</p>
            </div>
            <div class="info-card">
                <div class="card-icon">🌐</div>
                <h3>100% Online</h3>
                <p>Aprende desde cualquier lugar del mundo</p>
            </div>
            <div class="info-card">
                <div class="card-icon">🏆</div>
                <h3>Certificaciones</h3>
                <p>Obtén reconocimientos por tu aprendizaje</p>
            </div>
        </div>
    </div>

    <script src="js/app.js?v=4"></script>
    <script>
        checkIfLoggedIn();
    </script>
</body>
</html>
